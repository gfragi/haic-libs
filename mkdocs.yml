site_name: haic-libs
site_description: Open-source Python library for Human-AI Collaboration evaluation
site_url: https://gfragi.github.io/haic-libs
repo_url: https://github.com/gfragi/haic-libs
repo_name: gfragi/haic-libs
copyright: MIT License — HumAIne Horizon Europe project (Grant No. 101120218)

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/haic_logging/src
            - packages/haic_metrics/src
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Metrics: metrics.md
  - Interpretation guide: interpretation.md
  - Integration guide: integration.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true
